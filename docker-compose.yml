version: '3.8'

services:
  # Kosmos AI Scientist application
  kosmos:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kosmos-app
    profiles: ["prod"]
    environment:
      # Load from .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      - DATABASE_URL=postgresql://kosmos:${KOSMOS_PG_SUPER_PASSWORD:?set it in .env}@postgres:5432/kosmos
      - REDIS_ENABLED=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set it in .env}@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set it in .env}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_CONCURRENT_OPERATIONS=${ENABLE_CONCURRENT_OPERATIONS:-false}
      - ENABLE_PROFILING=${ENABLE_PROFILING:-false}
    volumes:
      - ./logs:/app/logs
      - ./results:/app/results
      - ./.chroma_db:/app/.chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "kosmos.cli.main", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - kosmos-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL database for SQLAlchemy ORM
  postgres:
    image: postgres:15-alpine
    container_name: kosmos-postgres
    profiles: ["dev", "prod"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=kosmos
      - POSTGRES_USER=kosmos
      - POSTGRES_PASSWORD=${KOSMOS_PG_SUPER_PASSWORD:?set it in .env}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmos -d kosmos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kosmos-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis cache for performance optimization
  redis:
    image: redis:7-alpine
    container_name: kosmos-redis
    profiles: ["dev", "prod"]
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set it in .env}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set it in .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - kosmos-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Neo4j graph database for knowledge graphs
  neo4j:
    image: neo4j:5.14-community
    container_name: kosmos-neo4j
    profiles: ["dev", "prod"]
    ports:
      - "127.0.0.1:7474:7474"  # HTTP (Web UI)
      - "127.0.0.1:7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:?set it in .env}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_import:/var/lib/neo4j/import
      - ./neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kosmos-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # pgAdmin for PostgreSQL management (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kosmos-pgadmin
    profiles: ["dev"]
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@kosmos.local
      - PGADMIN_DEFAULT_PASSWORD=${KOSMOS_PGADMIN_PASSWORD:?set it in .env}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - kosmos-network
    depends_on:
      - postgres

networks:
  kosmos-network:
    name: kosmos-network
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  pgadmin_data:
    driver: local
