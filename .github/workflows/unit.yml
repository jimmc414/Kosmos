name: unit

# Runs the unit suite on every push. No secrets: tests/conftest.py makes the suite hermetic
# (it ignores .env, removes credential variables and uses placeholder provider settings).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,execution,claude-code]"
      - name: Unit tests
        run: python -m pytest tests/unit --no-cov -p no:cacheprovider -q
